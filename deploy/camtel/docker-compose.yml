# ============================================================
# SIA-ANSAR — stack Docker pour VPS Camtel
# ============================================================
# Architecture :
#   web (Nginx :80)  →  fichiers React + proxy /api → api (Nest :3000)
#   api              →  Postgres (service db) OU DATABASE_URL externe (Supabase)
#
# Usage (depuis la racine du dépôt) :
#   cp deploy/camtel/.env.example deploy/camtel/.env
#   # éditer DATABASE_URL / FRONTEND_URL / secrets
#   docker compose -f deploy/camtel/docker-compose.yml --env-file deploy/camtel/.env up -d --build
#
# Avec Postgres local dans Docker (au lieu de Supabase) :
#   docker compose -f deploy/camtel/docker-compose.yml --env-file deploy/camtel/.env --profile with-db up -d --build

name: ansar-camtel

services:
  api:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ADDITIONAL_CORS_ORIGINS: ${ADDITIONAL_CORS_ORIGINS:-}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
    networks:
      - ansar
    # Avec profile with-db : attendre Postgres avant le healthcheck API.
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: same
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ansar

  # Optionnel : Postgres sur le VPS (profile with-db).
  # Sinon laissez DATABASE_URL pointer vers Supabase / un Postgres externe.
  db:
    image: postgres:16-alpine
    profiles: ["with-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ansar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ansar_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-truck_track}
    volumes:
      - ansar_pgdata:/var/lib/postgresql/data
    networks:
      - ansar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  ansar:
    driver: bridge

volumes:
  ansar_pgdata:
